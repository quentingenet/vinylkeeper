# Tests of the API and of the web app on every push and pull request, then deployment of the API
# on the VPS when main changes under vinylkeeper_back/. The web app is deployed by Netlify.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: API (flake8, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vinylkeeper_back
    env:
      # Placeholder settings for this throwaway GitHub test machine only, as the settings have no
      # defaults: they never reach the VPS, where docker compose reads app/.env.production and the
      # PostgreSQL volume as before. Nothing here connects to a real service: without
      # TEST_DATABASE_URL the real-database tests skip. APP_ENV=test keeps cookies non-secure.
      APP_ENV: test
      DATABASE_NAME: vinylkeeper
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_USERNAME: ci
      DATABASE_PASSWORD: ci
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/vinylkeeper
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "5"
      DB_POOL_TIMEOUT: "30"
      DB_POOL_RECYCLE: "1800"
      DB_STATEMENT_TIMEOUT: "30000"
      DB_LOCK_TIMEOUT: "5000"
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_MINUTES: "10080"
      RESET_TOKEN_EXPIRE_MINUTES: "30"
      ALGORITHM: RS256
      COOKIE_DOMAIN: localhost
      EMAIL_ADMIN: admin@example.com
      SMTP_PORT: "465"
      SMTP_SERVER: smtp.example.com
      SMTP_USERNAME: ci
      SMTP_PASSWORD: ci
      SMTP_FROM_ADDRESS: ci@example.com
      FRONTEND_URL: http://localhost:5173
      ALLOWED_ORIGINS: http://localhost:5173
      DEFAULT_ROLE_ID: "2"
      DISCOGS_API_URL: https://api.discogs.com
      DISCOGS_API_KEY: ci
      USER_AGENT: VinylKeeperCI/1.0
      ALBUM_ENRICHMENT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - run: pipx install poetry
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: poetry
          cache-dependency-path: vinylkeeper_back/poetry.lock
      - run: poetry install --no-interaction --no-root
      - name: JWT keys for the tests
        run: |
          mkdir -p app/keys
          openssl genrsa -out app/keys/private_key.pem 2048
          openssl rsa -in app/keys/private_key.pem -pubout -out app/keys/public_key.pem
      - run: poetry run flake8 app tests
      - run: poetry run pytest -q

  frontend:
    name: Web app (eslint, tsc, vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vinylkeeper_front
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: vinylkeeper_front/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit -p .
      - run: npm test

  deploy-api:
    name: Deploy the API on the VPS
    needs: backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # One deployment at a time; a newer push waits instead of cancelling a running one
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Did the API change?
        id: changes
        run: |
          before="${{ github.event.before }}"
          # First push of the branch or history rewritten: deploy to be safe
          if ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$before" "${{ github.sha }}" | grep -q '^vinylkeeper_back/'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
            echo "Only the web app changed: Netlify deploys it, the API stays as it is."
          fi
      - name: Deploy over SSH
        if: steps.changes.outputs.api == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key only runs deploy.sh on the server (forced command): no command is sent
          ssh -T -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST"
