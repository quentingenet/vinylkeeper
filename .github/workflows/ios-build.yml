# Build of the iOS app without signing, on a macOS runner: proves that the web app, the Capacitor plugins and the
# Swift code of the app compile for iOS, before any Apple account. Separate from ci.yml (no deployment here).
# Artifacts: an unsigned .ipa (to sign with a free Apple ID and install on an iPhone), the simulator app (to try in
# a browser, Appetize for instance), a screenshot of the app started in the simulator, and the Podfile.lock.
name: iOS build

# On main when the app changes (the API alone does not), on an ios-v* tag (to try a branch before it is merged),
# or by hand once this file is on main
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["ios-v*"]
    paths:
      - "vinylkeeper_front/**"
      - ".github/workflows/ios-build.yml"

permissions:
  contents: read

# A new run of the same ref replaces the one in progress
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS app (unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: vinylkeeper_front
    env:
      # The public settings of the production build: repository variables (Settings, Secrets and variables, Actions,
      # Variables tab), the values of .env.production; repository secrets of the same names are read too
      VITE_API_VK_URL: ${{ vars.VITE_API_VK_URL || secrets.VITE_API_VK_URL }}
      VITE_SPOTIFY_WEB_URL: ${{ vars.VITE_SPOTIFY_WEB_URL || secrets.VITE_SPOTIFY_WEB_URL }}
      VITE_SPOTIFY_MOBILE_URL: ${{ vars.VITE_SPOTIFY_MOBILE_URL || secrets.VITE_SPOTIFY_MOBILE_URL }}
      VITE_DEEZER_WEB_URL: ${{ vars.VITE_DEEZER_WEB_URL || secrets.VITE_DEEZER_WEB_URL }}
      VITE_DEEZER_MOBILE_URL: ${{ vars.VITE_DEEZER_MOBILE_URL || secrets.VITE_DEEZER_MOBILE_URL }}
      VITE_YOUTUBE_MUSIC_URL: ${{ vars.VITE_YOUTUBE_MUSIC_URL || secrets.VITE_YOUTUBE_MUSIC_URL }}
      WORKSPACE: ios/App/App.xcworkspace
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - name: The production settings are there
        run: |
          missing=0
          for name in VITE_API_VK_URL VITE_SPOTIFY_WEB_URL VITE_DEEZER_WEB_URL VITE_YOUTUBE_MUSIC_URL; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set: add it as a repository variable (not an environment one)"; missing=1; fi
          done
          exit $missing

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: vinylkeeper_front/package-lock.json

      - run: npm ci

      # The iOS app shows the version of the Android app (npm run version:set changes both)
      - name: Same version as Android
        run: npm run -s version:check

      - name: CocoaPods cache
        uses: actions/cache@v6
        with:
          path: |
            vinylkeeper_front/ios/App/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('vinylkeeper_front/ios/App/Podfile', 'vinylkeeper_front/ios/App/Podfile.lock', 'vinylkeeper_front/package-lock.json') }}

      # Production build, check that it calls the production API, copy into ios/ and pod install
      - run: npm run mobile:ios:prod:sync

      - name: Xcode version
        run: xcodebuild -version

      # Must pass: every Swift file, every pod and every plugin compiled for a real iPhone
      - name: Build for an iPhone, unsigned
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -workspace "$WORKSPACE" -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build/device.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/device/Build/Products/Release-iphoneos/App.app

      - name: Package the unsigned .ipa
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/device/Build/Products/Release-iphoneos/App.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../VinylKeeper-unsigned.ipa Payload)

      # For the Apple Silicon simulator (arm64, what Appetize runs): ML Kit has no arm64 simulator slice, so this build
      # leaves the barcode scanner out (a simulator has no camera; Capacitor skips a missing plugin). The iPhone build
      # above keeps it.
      - name: Build for the simulator
        id: simulator
        continue-on-error: true
        run: |
          set -o pipefail
          # The complete lock (with ML Kit) is kept for the artifacts before this build changes it
          cp ios/App/Podfile.lock build/Podfile.lock
          sed -i '' '/CapacitorMlkitBarcodeScanning/d' ios/App/Podfile
          (cd ios/App && pod install)
          xcodebuild -workspace "$WORKSPACE" -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CURRENT_PROJECT_VERSION="$BUILD_NUMBER" CODE_SIGNING_ALLOWED=NO \
            build | tee -a build/sim.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)"
          test -d build/sim/Build/Products/Debug-iphonesimulator/App.app
          # Appetize refuses an Intel-only simulator app
          lipo -archs build/sim/Build/Products/Debug-iphonesimulator/App.app/App | grep -q arm64

      - name: Start the app in an iPhone simulator
        if: steps.simulator.outcome == 'success'
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          echo "Simulator: $udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" build/sim/Build/Products/Debug-iphonesimulator/App.app
          mkdir -p build/screens
          # The output of the app (Capacitor writes what it loads and the errors of the web app), kept as it runs
          xcrun simctl launch --console-pty "$udid" org.vinylkeeper.app > build/app-console.log 2>&1 &
          console=$!
          # Two screenshots: a slow first load is not taken for a blank app
          sleep 20
          xcrun simctl io "$udid" screenshot build/screens/launch-20s.png
          sleep 40
          xcrun simctl io "$udid" screenshot build/screens/launch-60s.png
          # What iOS logged for the app ("Unknown class" of a storyboard, WebKit and Capacitor messages)
          xcrun simctl spawn "$udid" log show --last 5m --style compact \
            --predicate 'process == "App" OR subsystem BEGINSWITH "com.apple.WebKit" OR eventMessage CONTAINS "Unknown class"' \
            > build/app-system.log 2>&1 || true
          # Still running: a crash at launch (a wrong storyboard class, a missing plugin) fails here
          if ! xcrun simctl spawn "$udid" launchctl list | grep -q "org.vinylkeeper.app"; then
            echo "::error::The app is not running anymore after its launch"
            kill "$console" 2>/dev/null || true
            exit 1
          fi
          kill "$console" 2>/dev/null || true
          echo "--- app console (last lines)"; tail -n 40 build/app-console.log || true
          echo "--- unknown classes"; grep -i "unknown class" build/app-system.log || echo "none"
          (cd build/sim/Build/Products/Debug-iphonesimulator && zip -qry ../../../../VinylKeeper-simulator.zip App.app)

      - name: Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            vinylkeeper_front/build/VinylKeeper-unsigned.ipa
            vinylkeeper_front/build/VinylKeeper-simulator.zip
            vinylkeeper_front/build/screens/
            vinylkeeper_front/build/*.log
            vinylkeeper_front/build/Podfile.lock
